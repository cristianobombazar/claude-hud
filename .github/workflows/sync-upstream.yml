name: Sync upstream

# Merges jarrodwatts/claude-hud main into this fork every day, checks it, and stamps a fork
# version (X.Y.Z-fable.N) so /plugin update picks it up. There is no build: Node runs src/*.ts
# directly. A conflict outside the generated files fails the run and lists the files in the
# job summary instead of pushing (issues are disabled on this fork).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jarrodwatts/claude-hud.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge upstream/main --no-edit -m "chore: merge upstream $(git rev-parse --short upstream/main) [auto]"; then
            # Generated files and version stamps: take upstream's, or its deletion.
            git diff --name-only --diff-filter=U | while IFS= read -r f; do
              case "$f" in
                dist/*|package-lock.json|package.json|.claude-plugin/*)
                  if git cat-file -e ":3:$f" 2>/dev/null; then
                    git checkout --theirs -- "$f" && git add -- "$f"
                  else
                    git rm -q -- "$f"
                  fi
                  ;;
              esac
            done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
              git merge --abort
              exit 1
            fi
            git commit --no-edit
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check, stamp version and push
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          base=$(node -p "require('./package.json').version")
          version="${base}-fable.$(git rev-list --count HEAD)"
          # Edit the one line so the file stays byte-identical to upstream otherwise.
          sed -i -E "s/^(  \"version\": \")[^\"]+\"/\1${version}\"/" .claude-plugin/plugin.json
          grep -q "\"version\": \"${version}\"" .claude-plugin/plugin.json
          git add .claude-plugin/plugin.json
          git diff --staged --quiet || git commit -m "build: stamp ${version} [auto]"
          git push

      - name: Report conflict
        if: failure() && steps.merge.outputs.conflicts != ''
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          echo "::error title=Upstream merge conflict::Merging jarrodwatts/claude-hud main conflicts in: ${CONFLICTS}"
          {
            echo "## Upstream merge conflict"
            echo
            echo "Merging \`jarrodwatts/claude-hud\` main conflicts in: \`${CONFLICTS}\`"
            echo
            echo "Resolve locally: \`git fetch upstream && git merge upstream/main\`, then push."
          } >> "$GITHUB_STEP_SUMMARY"
